# LangGraph 배포용 compose 오버레이.
#
# `langgraph up -p 8123 --recreate -d docker-compose.deploy.yml`로 띄운다.
# `langgraph up`이 생성하는 compose에 이 파일이 먼저 병합되므로, 여기서는
# 호스트 자원 마운트와 그래프별 환경 변수만 추가한다.
#
# 컨테이너는 이 호스트의 다음 자원을 쓴다:
#   - llm-wiki            검증 리포트·지식 카탈로그 저장
#   - sonagi-assets       브랜드 토큰·에셋 카탈로그 (brand.py)
#   - /home/ubuntu/entry_pack  entry_pack 산출물(호스트에서 바로 열람)
#   - 로컬 폰트           ~/.local/share/fonts (브랜드 아웃라인 폰트)
#   - MDS tokens          design_token_sync 정본
#   - craft CLIs          video_ops / design_ops / asset_craft
#   - /var/www/craft-suite  video_ops CDN 배포
#   - SearXNG (:8080)     source_verification

services:
  langgraph-api:
    volumes:
      - /home/ubuntu/llm-wiki:/home/ubuntu/llm-wiki
      - /home/ubuntu/sonagi-assets:/home/ubuntu/sonagi-assets
      - /home/ubuntu/entry_pack:/tmp/entry_pack
      - /home/ubuntu/entry_pack:/home/ubuntu/entry_pack
      # /usr/share/fonts는 ro로 먼저 마운트되므로, 그 아래 local을 따로 붙이려면
      # 호스트에 /usr/share/fonts/local이 있어야 한다. 없으면 컨테이너 생성이
      # `mkdirat /usr/share/fonts/local: read-only file system`으로 실패한다.
      #   sudo mkdir -p /usr/share/fonts/local
      - /home/ubuntu/.local/share/fonts:/usr/share/fonts/local:ro
      - /usr/share/fonts:/usr/share/fonts:ro
      - /home/ubuntu/mindulle-design-system/packages/tokens:/home/ubuntu/mindulle-design-system/packages/tokens:ro
      - /var/www/craft-suite:/var/www/craft-suite
      - /usr/local/bin/filmcraft-cli:/usr/local/bin/filmcraft-cli:ro
      - /usr/local/bin/effectcraft-cli:/usr/local/bin/effectcraft-cli:ro
      - /usr/local/bin/vectorcraft-cli:/usr/local/bin/vectorcraft-cli:ro
      - /tmp/video_ops:/tmp/video_ops
      - /tmp/package_delivery:/tmp/package_delivery
    environment:
      # 호스트 서비스는 0.0.0.0에 바인딩되어 있다. Docker 브릿지 IP로 접근한다.
      OPENAI_API_BASE: http://172.19.0.1:38107/v1
      SEARXNG_URL: http://172.19.0.1:8080
      SONAGI_ASSETS_DIR: /home/ubuntu/sonagi-assets
      # scripts/sync_catalog.sh가 devops에서 동기화하는 실카탈로그(14k items).
      # 파일이 없으면 graphs/core/env.py가 골든 카탈로그로 경고 폴백한다.
      SONAGI_CATALOG: /home/ubuntu/sonagi-assets/catalog/catalog.json
      # entry_pack 산출물은 호스트와 같은 경로에 쓴다. 상태에 기록되는 manifest
      # 경로가 호스트에서도 그대로 열려야 `graph_cli show`가 읽을 수 있다.
      # (/tmp/entry_pack 마운트는 /tmp를 하드코딩한 옛 호출부용으로 남긴다)
      SONAGI_ENTRY_OUT: /home/ubuntu/entry_pack
      SONAGI_WIKI_DIR: /home/ubuntu/llm-wiki
      SONAGI_CDN_VIDEO_DIR: /var/www/craft-suite/video/exports
      MDS_TOKENS_DIR: /home/ubuntu/mindulle-design-system/packages/tokens
    extra_hosts:
      - "host.docker.internal:host-gateway"
