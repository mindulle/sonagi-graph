[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "sonagi-graph"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
    "langchain-openai>=0.1.0",
    "langgraph>=0.1.0",
    "langchain-core>=0.1.0",
    "typing_extensions>=4.0.0",
    "requests>=2.25.0",
    "python-dotenv>=1.0.0",
    "numpy>=1.26.0",
    "pillow>=10.0.0",
    "pyyaml>=6.0.0",
    "lxml>=5.0.0",
    "fonttools>=4.0.0",
    "pypdf>=5.0.0",
]

[tool.setuptools]
packages = ["graphs"]
py-modules = ["brand", "craft", "figma_drift", "token_sync"]
